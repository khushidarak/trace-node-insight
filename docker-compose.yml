services:

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: trace-frontend

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000

    depends_on:
      - backend

    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: trace-backend

    ports:
      - "8000:8000"

    restart: unless-stopped
